<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">Side-by-side excerpt of ActivityPulse Socket Block and Warn CLI reports</title>
<desc id="desc">Both reports indicate ok true and the same PyYAML potentialVulnerability alert. Block shows healthy false and policy error, while Warn shows healthy true and policy warn.</desc>
<rect width="1400" height="650" rx="18" fill="#101820"/>
<rect x="18" y="18" width="669" height="615" rx="12" fill="#192735" stroke="#667987" stroke-width="2"/>
<rect x="713" y="18" width="669" height="615" rx="12" fill="#192735" stroke="#667987" stroke-width="2"/>
<text x="45" y="65" font-size="26" font-family="Arial,sans-serif" font-weight="bold" fill="#ffffff">Activity 1 — Block</text>
<text x="740" y="65" font-size="26" font-family="Arial,sans-serif" font-weight="bold" fill="#ffffff">Activity 2 — Warn</text>
<text x="45" y="103" font-size="17" font-family="monospace" fill="#c8d5e2">socket scan report ... --fold=version</text>
<text x="740" y="103" font-size="17" font-family="monospace" fill="#c8d5e2">socket scan report ... --report-level=warn</text>
<g fill="#d9e7ef" font-size="22" font-family="monospace">
<text x="48" y="152">"ok": true,</text><text x="743" y="152">"ok": true,</text>
<text x="48" y="230">"healthy": false,</text><text x="743" y="230">"healthy": true,</text>
<text x="48" y="310">"alerts": {</text><text x="743" y="310">"alerts": {</text>
<text x="76" y="348">"pypi": { "pyyaml": {</text><text x="771" y="348">"pypi": { "pyyaml": {</text>
<text x="104" y="386">"6.0.2": {</text><text x="799" y="386">"6.0.2": {</text>
<text x="130" y="427">"type": "potentialVulnerability",</text><text x="825" y="427">"type": "potentialVulnerability",</text>
<text x="130" y="505">"policy": "error"</text><text x="825" y="505">"policy": "warn"</text>
<text x="104" y="546">} } }</text><text x="799" y="546">} } }</text>
</g>
<rect x="37" y="186" width="635" height="62" rx="7" fill="none" stroke="#fc7272" stroke-width="4"/>
<rect x="732" y="186" width="635" height="62" rx="7" fill="none" stroke="#75d6a0" stroke-width="4"/>
<rect x="115" y="460" width="545" height="65" rx="7" fill="none" stroke="#fc7272" stroke-width="4"/>
<rect x="810" y="460" width="545" height="65" rx="7" fill="none" stroke="#75d6a0" stroke-width="4"/>
<text x="45" y="604" font-size="20" font-family="Arial,sans-serif" fill="#ffb3b3">Policy blocked this finding.</text>
<text x="740" y="604" font-size="20" font-family="Arial,sans-serif" fill="#aef0c8">Finding visible; scan healthy.</text>
</svg>